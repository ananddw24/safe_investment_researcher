site_name: FinancialLibrary
site_description: Open educational hub for household financial literacy (not advice)
site_url: https://ananddw24.github.io/safe_investment_researcher/
repo_url: https://github.com/ananddw24/safe_investment_researcher
repo_name: ananddw24/safe_investment_researcher
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list

nav:
  - Home: index.md
  - Disclaimer: disclaimer.md
  - Glossary: glossary.md
  - About:
      - about/index.md
      - Using this library: about/using-this-library.md
      - For educators and NGOs: about/for-educators-and-ngos.md
      - Where to check official figures: about/where-to-check.md
      - Audience: about/audience.md
      - Licenses: about/licenses.md
      - Release plan: about/release-plan.md
  - Guides:
      - guides/index.md
      - Emergency savings: guides/emergency-savings.md
      - Inflation and capital preservation: guides/inflation-capital-preservation.md
      - Spotting unregulated schemes: guides/spotting-unregulated-schemes.md
