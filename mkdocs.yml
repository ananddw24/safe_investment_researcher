site_name: FinancialLibrary
site_description: Open educational hub for household financial literacy (not advice)
site_url: https://ananddw24.github.io/safe_investment_researcher/
repo_url: https://github.com/ananddw24/safe_investment_researcher
repo_name: ananddw24/safe_investment_researcher
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list

nav:
  - Home: index.md
  - Disclaimer: disclaimer.md
  - About:
      - about/index.md
      - Audience: about/audience.md
      - Licenses: about/licenses.md
      - Release plan: about/release-plan.md
  - Guides:
      - guides/index.md
      - Emergency savings: guides/emergency-savings.md
      - Inflation and capital preservation: guides/inflation-capital-preservation.md
      - Spotting unregulated schemes: guides/spotting-unregulated-schemes.md
  - Vehicles:
      - vehicles/index.md
      - India:
          - vehicles/in/index.md
          - Bank savings: vehicles/in/bank-savings.md
          - Recurring Deposit: vehicles/in/recurring-deposit.md
          - Fixed Deposit: vehicles/in/fixed-deposit.md
          - PPF: vehicles/in/ppf.md
          - Sukanya Samriddhi: vehicles/in/sukanya-samriddhi.md
          - NPS: vehicles/in/nps.md
          - SIP / ELSS literacy: vehicles/in/sip-elss.md
          - India Post schemes: vehicles/in/postal-schemes.md
          - Gold SGB vs physical: vehicles/in/gold-sgb-physical.md
          - SHG / microfinance: vehicles/in/shg-microfinance.md
      - United States:
          - vehicles/us/index.md
          - FDIC savings / MMDA: vehicles/us/fdic-savings.md
          - 401(k) and IRA concepts: vehicles/us/retirement-401k-ira.md
          - TreasuryDirect: vehicles/us/treasurydirect.md
          - Index funds / ETFs literacy: vehicles/us/index-funds-etfs.md
          - Credit union savings: vehicles/us/credit-union-savings.md
          - 529 / Coverdell: vehicles/us/education-529-coverdell.md
      - Kenya:
          - vehicles/ke/index.md
          - Mobile money savings: vehicles/ke/mobile-money-savings.md
          - Bank / MFI deposits: vehicles/ke/bank-mfi-deposits.md
          - Money market funds: vehicles/ke/money-market-funds.md
          - Treasury bills / bonds: vehicles/ke/treasury-bills-bonds.md
          - SACCOs: vehicles/ke/saccos.md
          - NSSF / pensions: vehicles/ke/nssf-pensions.md
  - Pathways:
      - pathways/index.md
      - Woman-led household: pathways/woman-led-household.md
  - Resources: resources/index.md
  - Contributing: contributing.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ananddw24/safe_investment_researcher
