name: ci-data

on:
  push:
    paths:
      - "data/**"
      - "scripts/validate_data.py"
      - "scripts/check_ids.py"
      - "scripts/export_resources_json.py"
      - "scripts/generate_resources_catalog.py"
      - "docs/resources/catalog.md"
      - "scripts/requirements-dev.txt"
      - ".github/workflows/ci-data.yml"
  pull_request:
    paths:
      - "data/**"
      - "scripts/validate_data.py"
      - "scripts/check_ids.py"
      - "scripts/export_resources_json.py"
      - "scripts/generate_resources_catalog.py"
      - "docs/resources/catalog.md"
      - "scripts/requirements-dev.txt"
      - ".github/workflows/ci-data.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-dev.txt

      - name: Install validation deps
        run: pip install -r scripts/requirements-dev.txt

      - name: Validate YAML against schemas
        run: python scripts/validate_data.py

      - name: Check id uniqueness
        run: python scripts/check_ids.py

      - name: Export resources JSON
        run: python scripts/export_resources_json.py

      - name: Check resource catalog is up to date
        run: python scripts/generate_resources_catalog.py --check
