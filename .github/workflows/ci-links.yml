name: ci-links

on:
  push:
    paths:
      - "docs/**"
      - "data/resources/**"
      - ".lychee.toml"
      - ".github/workflows/ci-links.yml"
  pull_request:
    paths:
      - "docs/**"
      - "data/resources/**"
      - ".lychee.toml"
      - ".github/workflows/ci-links.yml"
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Extract resource URLs
        run: |
          mkdir -p .lychee-inputs
          python3 scripts/extract_resource_urls.py .lychee-inputs

      # Soft-fail at v0.1: flip to hard-fail after first country seed (v0.2.0) when allowlist is stable
      - name: Link check (soft-fail until v0.2.0)
        continue-on-error: true
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          args: >-
            --config .lychee.toml
            docs/
            .lychee-inputs/resource-urls.txt
