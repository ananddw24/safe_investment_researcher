name: weekly-update

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Link check (resource URLs)
        id: links
        continue-on-error: true
        run: |
          mkdir -p .lychee-inputs /tmp/weekly
          python3 scripts/extract_resource_urls.py .lychee-inputs
          set +e
          npx --yes lychee@0.18.1 \
            --no-progress \
            --max-concurrency 4 \
            --timeout 20 \
            --user-agent "FinancialLibraryWeeklyBot/0.7" \
            .lychee-inputs/resource-urls.txt \
            > /tmp/weekly/lychee.txt 2>&1
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ]; then
            echo "Link check reported failures (see lychee.txt in the PR/issue)."
          fi

      - name: Refresh where-to-check as-of when fetches succeed
        run: |
          mkdir -p /tmp/weekly
          python3 scripts/weekly_where_to_check.py \
            --report /tmp/weekly/where-to-check-report.md

      - name: Compose proposal body
        run: |
          {
            echo "## Weekly maintenance proposal"
            echo
            echo "This workflow **never pushes to \`main\`**. It opens a PR when"
            echo "there are doc changes, otherwise an issue summarizing what to re-check."
            echo
            echo "### Where-to-check"
            echo
            cat /tmp/weekly/where-to-check-report.md
            echo
            echo "### Link check"
            echo
            echo "Exit code: \`${{ steps.links.outputs.exit_code }}\`"
            echo
            echo '```'
            tail -n 80 /tmp/weekly/lychee.txt 2>/dev/null || echo "(no lychee output)"
            echo '```'
          } > /tmp/weekly/body.md

      - name: Open pull request when files changed
        id: pr
        uses: actions/github-script@60a0d83039c8a0a3b51d79a4c6811ea564e948e9  # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            const body = fs.readFileSync('/tmp/weekly/body.md', 'utf8');
            const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 16);
            const branch = `chore/weekly-update-${stamp}`;

            execSync('git config user.name "github-actions[bot]"');
            execSync('git config user.email "41898282+github-actions[bot]@users.noreply.github.com"');
            execSync('git add docs/about/where-to-check.md || true');
            let changed = true;
            try {
              execSync('git diff --cached --quiet');
              changed = false;
            } catch (_) {
              changed = true;
            }

            core.setOutput('changed', changed ? 'true' : 'false');
            if (!changed) {
              core.setOutput('pr_number', '');
              return;
            }

            execSync(`git checkout -b ${branch}`);
            execSync(`git commit -m "chore: weekly where-to-check as-of refresh (${stamp})"`);
            execSync(`git push -u origin ${branch}`);

            const pr = (await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `chore: weekly update ${stamp}`,
              head: branch,
              base: 'main',
              body,
            })).data;
            core.setOutput('pr_number', String(pr.number));

      - name: Open issue when no doc PR (or PR creation failed)
        if: always() && (steps.pr.outputs.changed != 'true' || steps.pr.outcome == 'failure')
        uses: actions/github-script@60a0d83039c8a0a3b51d79a4c6811ea564e948e9  # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/weekly/body.md', 'utf8');
            const title = 'Weekly update: human re-check list';
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'maintenance',
            });
            const existing = issues.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['maintenance'],
              });
            }
