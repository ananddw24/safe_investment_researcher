name: Bug
description: Docs build, data validate, or site page broke
title: "[bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: What broke?
      options:
        - Docs build (mkdocs)
        - Data validate (schema / scripts)
        - Site page content
        - CI workflow
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS (optional)
      placeholder: e.g. Ubuntu 24.04 / macOS 15
