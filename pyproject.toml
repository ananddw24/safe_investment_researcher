[project]
name = "financial-library"
version = "0.7.0"
description = "Open educational hub for household financial literacy (not advice)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Education",
  "Topic :: Office/Business :: Financial",
]
authors = [{ name = "Anand Dwivedi", email = "anand.dw24@gmail.com" }]
keywords = ["financial-literacy", "education", "mkdocs"]

[project.urls]
Homepage = "https://github.com/ananddw24/safe_investment_researcher"
Documentation = "https://ananddw24.github.io/safe_investment_researcher/"
Repository = "https://github.com/ananddw24/safe_investment_researcher"

[tool.financial-library]
# requirements.txt remains canonical for CI installs

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
